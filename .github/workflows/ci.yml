name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate partner token secret on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PARTNER_TOKENS_JSON: ${{ secrets.PARTNER_TOKENS_JSON }}
        run: |
          if [ -z "$PARTNER_TOKENS_JSON" ]; then
            echo "Missing required secret: PARTNER_TOKENS_JSON"
            exit 1
          fi

      - name: Run tests
        env:
          PARTNER_TOKENS_JSON: ${{ secrets.PARTNER_TOKENS_JSON }}
        run: |
          python -m pytest -q